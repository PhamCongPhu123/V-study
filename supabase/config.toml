project_id = "vstudy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.vstudy.app://login-callback/", "io.vstudy.app://login-callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m"

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.ai-chat]
# Functions explicitly validate the token with auth.getUser; supports hosted keys.
verify_jwt = false

[functions.generate-quiz]
verify_jwt = false

[functions.study-assistant]
verify_jwt = false
